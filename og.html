<!doctype html>
<html lang="en-GB" data-theme="dark" data-theme-pref="dark">
<head>
<meta charset="utf-8">
<title>OG render</title>
<link rel="stylesheet" href="/app.css">
<style>
  html,body{width:1200px;height:630px;overflow:hidden}
  body{position:relative;background:#0B0E14}

  .hd{position:absolute;left:56px;top:40px;right:56px}
  .k{font:500 15px "IBM Plex Mono",monospace;letter-spacing:.14em;color:#8B94A8;display:flex;align-items:center;gap:12px}
  .k i{width:11px;height:11px;border-radius:50%;display:inline-block}
  h1{font:700 50px/1.05 "Space Grotesk";color:#E8ECF4;margin:14px 0 0;letter-spacing:-.01em}
  .by{position:absolute;left:56px;right:56px;bottom:30px;display:flex;justify-content:space-between;font:500 17px "IBM Plex Mono",monospace;color:#E8ECF4;z-index:2}
  .by span{color:#8B94A8}
  .bar,aside,#tip,.flowlog{display:none}
</style>
</head>
<body>
<div class="hd"><div class="k"><span><i style="background:#9B6BE8"></i> <i style="background:#4A7FE8"></i> <i style="background:#2BB8C8"></i> <i style="background:#3CC48A"></i> <i style="background:#F2C14E"></i> <i style="background:#F07A3E"></i> <i style="background:#E5487A"></i></span>OSI SECURITY RINGS</div>

</html>
